# Baseline ISL Continuous Translation Configuration

model:
  name: "isl_pose_transformer_base_v1"
  input_dim: 225         # 75 keypoints * 3 coordinates (x, y, z)
  d_model: 256
  nhead: 4
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.1
  max_seq_len: 500
  max_target_len: 60

loss:
  ctc_weight: 0.3        # lambda_ctc (0.3 CTC + 0.7 CrossEntropy)
  label_smoothing: 0.1

training:
  seed: 42
  batch_size: 16
  accumulate_grad_batches: 2
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_epochs: 50
  gradient_clip_val: 1.0
  lr_warmup_epochs: 5
  mixed_precision: true  # FP16 on CUDA
  early_stopping_patience: 10
  save_dir: "ml/checkpoints"

data:
  manifest_dir: "data/manifests"
  vocab_path: "data/manifests/vocab.json"
  target_fps: 25
